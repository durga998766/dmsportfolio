<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume — Durgamadhaba Sahoo</title>
<meta name="description" content="Resume of Durgamadhaba Sahoo — UI/UX and visual designer." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&family=Sedgwick+Ave+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   RESUME PAGE — premium dark-red gradient, Linear/Stripe-style
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d0406;
  min-height: 100vh;
  font-family: var(--body, 'Inter', sans-serif);
  -webkit-font-smoothing: antialiased;
}

.resume-page {
  min-height: 100vh;
  background:
    radial-gradient(ellipse 80% 60% at 20% -10%, rgba(140,10,36,.55) 0%, transparent 65%),
    radial-gradient(ellipse 60% 50% at 80% 110%, rgba(90,4,20,.45) 0%, transparent 60%),
    linear-gradient(165deg, #1c0309 0%, #0d0406 55%, #080204 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 56px clamp(24px, 6vw, 96px) 100px;
}

/* back link */
.resume-back {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.38);
  text-decoration: none;
  margin-bottom: 72px;
  transition: color .3s ease;
}
.resume-back:hover { color: rgba(255,255,255,.8); }
.resume-back svg { flex-shrink: 0; }

/* header */
.resume-header {
  text-align: center;
  margin-bottom: 52px;
}
.resume-eyebrow {
  display: block;
  font-family: var(--body, 'Inter', sans-serif);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: #C81034;
  margin-bottom: 18px;
}
.resume-title {
  font-family: var(--display, 'Shippori Mincho', serif);
  font-size: clamp(36px, 5.5vw, 64px);
  font-weight: 700;
  line-height: 1.05;
  color: #fff;
  letter-spacing: -.01em;
}
.resume-subtitle {
  margin-top: 14px;
  font-size: 14px;
  color: rgba(255,255,255,.35);
  letter-spacing: .04em;
}

/* PDF preview card */
.resume-card {
  width: 100%;
  max-width: 860px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 2px 0 rgba(255,255,255,.04) inset,
    0 48px 96px rgba(0,0,0,.55),
    0 0 0 1px rgba(200,16,52,.12);
  transition: transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s cubic-bezier(.22,1,.36,1);
  cursor: default;
}
.resume-card:hover {
  transform: translateY(-5px) scale(1.006);
  box-shadow:
    0 2px 0 rgba(255,255,255,.05) inset,
    0 64px 120px rgba(0,0,0,.65),
    0 0 0 1px rgba(200,16,52,.22);
}

.resume-embed {
  display: block;
  width: 100%;
  height: 72vh;
  min-height: 480px;
  border: none;
  background: #fff;
}

/* action buttons */
.resume-actions {
  display: flex;
  gap: 14px;
  margin-top: 36px;
  flex-wrap: wrap;
  justify-content: center;
}

/* override .btn colours for the dark background */
.resume-actions .btn {
  background: #C81034;
  border-color: #C81034;
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 26px;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  border: 1px solid #C81034;
  text-decoration: none;
  font-family: var(--body, 'Inter', sans-serif);
  font-weight: 600;
  transition: background .3s ease, border-color .3s ease, transform .25s ease;
}
.resume-actions .btn:hover {
  background: #a00c27;
  border-color: #a00c27;
  transform: translateY(-1px);
}
.resume-actions .btn.ghost {
  background: transparent;
  border-color: rgba(255,255,255,.18);
  color: rgba(255,255,255,.65);
}
.resume-actions .btn.ghost:hover {
  background: rgba(255,255,255,.07);
  border-color: rgba(255,255,255,.35);
  color: #fff;
}

/* responsive */
@media (max-width: 600px) {
  .resume-embed { height: 55vh; }
}
</style>
</head>
<body>

<div class="resume-page">

  <!-- back link -->
  <a href="index.html" class="resume-back">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
    </svg>
    Back to Portfolio
  </a>

  <!-- header -->
  <header class="resume-header">
    <span class="resume-eyebrow">Resume</span>
    <h1 class="resume-title">One page,<br>the whole story.</h1>
    <p class="resume-subtitle">Durgamadhaba Sahoo &mdash; UI/UX &amp; Visual Designer</p>
  </header>

  <!-- PDF preview -->
  <div class="resume-card">
    <iframe
      src="assets/durgamadhaba-sahoo-resume.pdf#toolbar=0&navpanes=0&scrollbar=0"
      class="resume-embed"
      title="Durgamadhaba Sahoo — Resume PDF"
      loading="lazy"
    ></iframe>
  </div>

  <!-- action buttons -->
  <div class="resume-actions">
    <a class="btn" href="assets/durgamadhaba-sahoo-resume.pdf" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      View Resume
    </a>
    <a class="btn ghost" href="assets/durgamadhaba-sahoo-resume.pdf" download="Durgamadhaba-Sahoo-Resume.pdf">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download PDF
    </a>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!window.gsap) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;
  // Entrance animation — staggered fade-up for header, card, actions
  gsap.from(['.resume-back', '.resume-header', '.resume-card', '.resume-actions'], {
    opacity: 0,
    y: 28,
    duration: 0.85,
    ease: 'power3.out',
    stagger: 0.1,
    delay: 0.08,
  });
});
</script>
</body>
</html>
